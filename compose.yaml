services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ecommerve
      POSTGRES_USER: ecommerve
      POSTGRES_PASSWORD: ecommerve
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerve -d ecommerve"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
